map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream relay_backend {
    # Round-robin distribution across both Spring WebFlux replicas
    server relay-app-1:8080 max_fails=3 fail_timeout=10s;
    server relay-app-2:8080 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name localhost;

    # Client body limit for attachments (up to 30 MB)
    client_max_body_size 30M;

    # REST API endpoints
    location / {
        proxy_pass http://relay_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # STOMP over WebSocket endpoint
    location /ws {
        proxy_pass http://relay_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep alive long-lived WebSocket connections
        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
    }
}
